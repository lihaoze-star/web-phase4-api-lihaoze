services:
  - type: web
    name: web-phase4-api-lihaoze
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/tasks
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_MODEL
        value: deepseek-chat
      - key: MAX_CONTEXT_CHARS
        value: "6000"
      - key: LLM_API_KEY
        sync: false
